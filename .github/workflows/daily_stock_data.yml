name: 每日台股數據收集

on:
  schedule:
    - cron: '40 5 * * 1-5'
  workflow_dispatch:

jobs:
  collect-stock-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v3
      
      - name: 設定 Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 收集台股數據
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python src/main.py

